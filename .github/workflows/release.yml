name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: deploy/docker/api.Dockerfile
          - name: agent
            dockerfile: deploy/docker/agent.Dockerfile
          - name: web
            dockerfile: deploy/docker/web.Dockerfile

    steps:
      - uses: actions/checkout@v4

      # The tag is the only version input: a moving `latest` makes a rollback
      # ambiguous, so operators pin the tag an incident was investigated on.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
